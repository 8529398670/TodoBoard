# Every piece of text the UI can show lives here, and nowhere else.
#
# Two rules make this useful rather than just indirection:
#
#   1. Translating or rewording the app is an edit to this file plus a
#      restart. No HTML or JS changes, no rebuild.
#   2. A key that is missing or empty ("") hides its element entirely. That
#      is how you turn a label, a button, or a whole section off without
#      touching the markup -- set it to "" and it disappears rather than
#      rendering blank or showing a raw key name.
#
# This file is served to any visitor at /api/language, signed in or not, since
# the signed-out page needs text too. Never put anything secret in it.

app:
  title: "TodoBoards"
  tagline: ""

signed_out:
  heading: "You are not signed in"
  body: "There is no signup form here on purpose. Ask an admin for a login link, or for your group's invite link."
  invalid_link: "That login link is invalid, expired, cancelled, or used up. Ask for a new one."
  sign_in_expired: "That sign-in took too long and has expired. Start again."
  # The password form, shown only while auth.passwords is on.
  password_heading: "Sign in with a password"
  username_label: "Username"
  password_label: "Password"
  password_button: "Sign in"
  paste_label: "Paste your login link"
  paste_help: "This app cannot open links. In your browser, create a login link on the Account page, copy it, and paste it here."
  paste_button: "Sign in"
  session_ended: "You have been signed out. Your session ended, or it was signed out from another device."

login_confirm:
  heading: "Sign in"
  body: "This is a login link for one account. It may work only once, so open it on the device you mean to use."
  # {name} is replaced with the account currently signed in.
  switch_warning: "You are signed in as {name}. Continuing signs you out of that account and into the one this link is for."
  button: "Sign in"

# What an invite link opens (/join/...). Nothing is created until a button
# is pressed. {label} is the link's label, {name} the name typed or picked.
join:
  heading: "Join {label}"
  body: "Type your name. If you have joined through this link before, type the same name to sign back in on this device."
  name_label: "Your name"
  name_placeholder: "Your name"
  continue_button: "Continue"
  did_you_mean: "Is one of these you?"
  no_match: "Nobody with a name like that has joined through this link yet."
  this_is_me: "That's me"
  has_pin: "PIN"
  create_new: "No, I'm new -- join as {name}"
  create_first: "Join as {name}"
  full: "This link has no places left. You can still sign back in if you joined through it before."
  back_button: "Back"
  pin_prompt: "Enter the PIN for {name}."
  pin_label: "PIN"
  pin_button: "Sign in"
  switch_warning: "You are signed in as {name}. Continuing signs you out of that account."
  invalid_heading: "This link is not working"
  invalid: "This invite link is invalid, expired, or has been switched off. Ask whoever shared it for a new one."

account:
  heading: "Account"
  display_name_label: "Display name"
  display_name_placeholder: "Your name"
  save_button: "Save"
  saved_notice: "Saved."
  logout_button: "Log out"

# A login link for yourself, from the Account page.
own_login:
  heading: "Sign in on another device"
