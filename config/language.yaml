# Only offered to non-admin accounts: an admin can never be signed in to
# through an invite link, so a PIN would protect nothing.
pin:
  heading: "PIN"
  description: "If you joined through an invite link, anyone else holding that link could pick your name and sign in as you. Set a PIN and it will be asked for. Nothing else uses it."
