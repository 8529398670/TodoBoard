  again_button: "Create a new link"
  # {summary} says how often and how long it works.
  link_notice: "Anyone with this link can sign in as you. {summary}."
  copy_button: "Copy link"
  copied_notice: "Copied."

# How many times a login link works and for how long: the choices on the
