  download_button: "Download"
  done_button: "Done"
  disable_button: "Turn off"
  code_label: "Code from your app, or a recovery code"
  step_heading: "Enter your code"
  step_body: "This account has two-factor sign-in on. Enter the code from your authenticator app, or a recovery code."
