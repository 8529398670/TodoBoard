  description: "Create an account by minting a login link. Send the link to the person; it works once."
  new_name_label: "Name"
  new_name_placeholder: "Their name"
  new_role_label: "Role"
  role_user: "user"
  role_admin: "admin"
  create_button: "Create login link"
  link_notice: "Send this one-time link. It is shown once and cannot be recovered, and any earlier unused link for this person has stopped working."
  copy_button: "Copy"
  copied_notice: "Copied."
  table_name: "Name"
  table_role: "Role"
  table_status: "Status"
  table_actions: "Actions"
  status_active: "active"
  status_disabled: "disabled"
  reissue_button: "New link"
  revoke_button: "Revoke access"
  # {name} is replaced with the account's display name.
  revoke_confirm: "End every session, unused login link and API key that {name} has? The account stays enabled; send them a new link to let them back in."
  disable_button: "Disable"
  enable_button: "Enable"
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation before deleting.
  delete_confirm: "Permanently delete {name}? Their sessions, login links and API keys go with the account, and it cannot be undone. Disable the account instead if they might come back."
  # Shown after the role of the one owner account, e.g. "admin (owner)".
  owner_label: "owner"

api_keys:
  heading: "API keys"
  description: "For scripts, cron jobs, and other services. A key does exactly what your account can do -- send it as an Authorization: Bearer header. It is shown once."
  name_label: "What is it for"
  name_placeholder: "deploy bot"
  role_label: "Permission"
  role_user: "user"
  role_admin: "admin (can manage accounts)"
  days_label: "Expires in (days)"
  days_placeholder: "leave blank for the default, 0 for never"
  create_button: "Create key"
  secret_notice: "Copy this now. It is shown once and cannot be recovered -- if you lose it, revoke the key and create another."
  copy_button: "Copy"
  copied_notice: "Copied."
  table_name: "Name"
  table_role: "Permission"
  table_status: "Status"
  table_last_used: "Last used"
  table_expires: "Expires"
  table_actions: "Actions"
  status_active: "active"
  status_revoked: "revoked"
  status_expired: "expired"
  never: "never"
  revoke_button: "Revoke"
  # Empty this string to stop asking for confirmation before revoking.
  revoke_confirm: "Revoke this key? Anything using it stops working immediately."
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation before deleting.
  delete_confirm: "Delete this key permanently? Anything using it stops working immediately, and it disappears from the list."

# Only offered to non-admin accounts: an admin can never be signed in to
# through an invite link, so a PIN would protect nothing.
pin:
  heading: "PIN"
  description: "If you joined through an invite link, anyone else holding that link could pick your name and sign in as you. Set a PIN and it will be asked for. Nothing else uses it."
  status_set: "A PIN is set."
  status_none: "No PIN is set."
  label: "New PIN"
  placeholder: "4 to 8 digits"
  save_button: "Set PIN"
  clear_button: "Remove PIN"
  saved_notice: "Saved."

invite_links:
  heading: "Invite links"
  description: "One link for a group: post it in a group chat and each person who opens it joins as a new user, until the places run out. People who joined through it can sign back in on a new device with the same link."
