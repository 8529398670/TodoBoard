  copy_button: "Copy"
  copied_notice: "Copied."
  table_label: "Link"
  table_joined: "Joined"
  table_status: "Status"
  table_expires: "Expires"
  table_actions: "Actions"
  # {used} and {max} are numbers.
  joined_of: "{used} of {max}"
  status_live: "live"
  status_full: "full"
  status_expired: "expired"
  status_revoked: "switched off"
