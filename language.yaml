  status_orphaned: "maker no longer an admin"
  revoke_button: "Switch off"
  # Empty this string to stop asking for confirmation.
  revoke_confirm: "Switch off this link? Nobody can join or sign back in through it any more. Accounts it made keep working."
  delete_button: "Delete"
  # Empty this string to stop asking for confirmation.
  delete_confirm: "Delete this link from the list? It stops working if it has not already. Accounts it made stay."

