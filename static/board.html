<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <!-- Before the stylesheets paint, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <!-- The same stack as index.html: Bootstrap and its icon font, this app's
       overrides, then the board's own pieces. -->
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/board.css" />
</head>
<body class="board-page">
  <!--
    One page for members (/b/<id>) and for guests with a share link
    (/s/<credential>); board.js tells them apart. As everywhere, no text is
    written here -- data-i18n keys pull it from language.yaml, and where an
    icon sits beside a label the key goes on an inner <span>.

    No sidebar: a board wants the whole width. The navbar is index.html's,
    with the board's own actions on the right. Switching view and showing
    archived cards are in Board settings, under View.
  -->
  <nav class="navbar app-navbar board-navbar sticky-top">
    <div class="container-fluid gap-2 flex-nowrap">
      <!-- The app's name is the way home, as on every page. A guest has no
           home here, so board.js hides it for them. -->
      <a id="home-link" class="navbar-brand fw-semibold me-0" href="/" data-i18n="app.title"></a>
      <h1 id="board-title" class="board-title h5 mb-0 me-auto text-truncate"></h1>
      <!-- Share, notifications and export live inside Board settings; your
           own settings live on the home page. A guest has no account, so they
           get the one personal setting they can use (the theme) here. -->
      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <button type="button" id="undo-button" class="btn btn-link app-icon-button" data-i18n-attr="aria-label:board.undo,title:board.undo_hint" hidden disabled><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
        <button type="button" id="redo-button" class="btn btn-link app-icon-button" data-i18n-attr="aria-label:board.redo,title:board.redo_hint" hidden disabled><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
        <button type="button" id="trash-button" class="btn btn-link app-icon-button" data-i18n-attr="aria-label:trash.title,title:trash.title" hidden><i class="bi bi-trash3" aria-hidden="true"></i></button>
        <button type="button" id="settings-button" class="btn btn-link app-icon-button" data-i18n-attr="aria-label:settings.title,title:settings.title" hidden><i class="bi bi-gear" aria-hidden="true"></i></button>
        <button type="button" id="guest-settings-button" class="btn btn-link app-icon-button" data-user-settings data-i18n-attr="aria-label:nav.settings,title:nav.settings" hidden><i class="bi bi-palette" aria-hidden="true"></i></button>
        <a id="account-link" class="btn btn-link app-icon-button" href="/#account" data-i18n-attr="aria-label:nav.account,title:nav.account" hidden><i class="bi bi-person-circle" aria-hidden="true"></i></a>
      </div>
    </div>
  </nav>

  <div id="guest-banner" class="alert alert-info guest-banner" role="status" hidden></div>

  <main id="board-root" class="board-root"></main>

  <!-- The card editor (card_modal.js). A native <dialog> with Bootstrap's
       look rather than a Bootstrap modal: a panel (share, export) opens over
       it, and <dialog> stacks, traps focus and handles Escape by itself. -->
  <dialog id="card-dialog" class="app-dialog card-dialog">
    <div id="card-dialog-body" class="card-dialog-body"></div>
  </dialog>

  <!-- The side panel every board form opens in (Panel in ui.js). -->
  <dialog id="panel-dialog" class="app-dialog panel-dialog">
    <div class="panel-head d-flex align-items-center justify-content-between gap-2 border-bottom">
      <h2 id="panel-title" class="h5 mb-0"></h2>
      <button type="button" id="panel-close" class="btn-close" data-i18n-attr="aria-label:ui.close,title:ui.close"></button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </dialog>

  <dialog id="guest-name-dialog" class="app-dialog panel-dialog">
    <form id="guest-name-form" method="dialog" autocomplete="off" class="d-flex flex-column gap-3 p-3">
      <h2 class="h5 mb-0" data-i18n="share.guest_name_heading"></h2>
      <p class="text-body-secondary mb-0" data-i18n="share.guest_name_body"></p>
      <div>
        <label for="guest-name-input" class="form-label" data-i18n="share.guest_name_label"></label>
        <input id="guest-name-input" class="form-control" maxlength="40" data-i18n-attr="placeholder:share.guest_name_placeholder" />
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary" data-i18n="share.guest_name_continue"></button>
        <button type="button" id="guest-name-skip" class="btn btn-outline-secondary" data-i18n="share.guest_name_skip"></button>
      </div>
    </form>
  </dialog>

  <!-- Off-screen: card PNG exports are drawn from here. -->
  <div id="export-stage" class="export-stage" aria-hidden="true"></div>

  <!-- "Saved.", "Copied.": see Dom.toast. -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast border-0" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="4000">
      <div id="toast-body" class="toast-body"></div>
    </div>
  </div>

  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/vendor/marked/marked.min.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/mhchem.min.js"></script>
  <script src="/vendor/sortable/Sortable.min.js"></script>
  <script src="/vendor/html-to-image/html-to-image.js"></script>
  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/board_api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/color_picker.js"></script>
  <script src="/js/theme_editor.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/view_kanban.js"></script>
  <script src="/js/view_todo.js"></script>
  <script src="/js/view_timeline.js"></script>
  <script src="/js/card_modal.js"></script>
  <script src="/js/card_export.js"></script>
  <script src="/js/backup.js"></script>
  <script src="/js/sharing.js"></script>
  <script src="/js/subscribe.js"></script>
  <script src="/js/board_settings.js"></script>
  <script src="/js/user_settings.js"></script>
  <script src="/js/trash.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
