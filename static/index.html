<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Before the stylesheets paint, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <!-- Bootstrap 5 and its icon font, vendored (see /vendor/README.md), then
       this app's overrides on top, then the board pieces the home page shares
       with the board page (tiles, folders, theme editor, side panel). -->
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/board.css" />
</head>
<body>
  <a id="skip-link" href="#main" class="visually-hidden-focusable" data-i18n="nav.skip"></a>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.

    data-i18n replaces an element's text, so wherever an icon sits next to a
    label the key goes on an inner <span>, never on the element holding both.

    Headings use .h4 rather than .card-title: board.css sizes .card-title for
    the cards on a board.
  -->
  <nav class="navbar app-navbar border-bottom sticky-top" data-i18n-attr="aria-label:nav.top_label">
    <div class="container-fluid gap-2">
      <!-- Opens the sidebar on a phone; folds it away and back on a wide
           screen (Nav.toggleSidebar). -->
      <button id="sidebar-toggle" class="btn btn-link app-icon-button" type="button"
              aria-controls="sidebar" aria-expanded="true"
              data-i18n-attr="aria-label:nav.menu,title:nav.menu" hidden>
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <!-- The app's logo is the way home, from any screen. -->
      <a href="/" class="navbar-brand me-auto" data-i18n-attr="aria-label:app.title,title:app.title">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect class="brand-mark-back" x="2" y="8.5" width="19" height="19" rx="5" />
          <rect class="brand-mark-card" x="6" y="4.5" width="24" height="24" rx="6" />
          <path class="brand-mark-check" d="M11.5 17l4.5 4.5 8.5-9.5" />
        </svg>
      </a>
      <span class="navbar-text small d-none d-md-inline" data-i18n="app.tagline"></span>
    </div>
  </nav>

  <div class="app-shell">
    <!--
      Every signed-in screen is one entry here and one data-view section in
      <main>. nav.js shows the one the URL hash names, and hides an entry
      whose section the app left hidden (admin-only, switched off, ...).
      offcanvas-lg: a slide-in panel on a phone, a fixed column from lg up.
    -->
    <aside id="sidebar" class="offcanvas-lg offcanvas-start app-sidebar" tabindex="-1" aria-labelledby="sidebar-title" hidden>
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5" id="sidebar-title" data-i18n="app.title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div class="offcanvas-body">
        <nav id="sidebar-nav" class="nav nav-pills flex-column w-100 gap-1" data-i18n-attr="aria-label:nav.sidebar_label">
          <a class="nav-link" href="#boards" data-nav="boards"><i class="bi bi-kanban" aria-hidden="true"></i><span data-i18n="nav.boards"></span></a>

          <div class="sidebar-group">
            <h3 class="sidebar-heading" data-i18n="nav.you_heading"></h3>
            <!-- Its title says who is signed in; see App.labelProfile. -->
            <a class="nav-link" href="#account" data-nav="account" id="profile-link"><i class="bi bi-person" aria-hidden="true"></i><span data-i18n="nav.account"></span></a>
            <a class="nav-link" href="#settings" data-nav="settings"><i class="bi bi-palette" aria-hidden="true"></i><span data-i18n="nav.settings"></span></a>
            <a class="nav-link" href="#notifications" data-nav="notifications"><i class="bi bi-bell" aria-hidden="true"></i><span data-i18n="nav.notifications"></span></a>
            <a class="nav-link" href="#backup" data-nav="backup"><i class="bi bi-archive" aria-hidden="true"></i><span data-i18n="nav.backup"></span></a>
            <a class="nav-link" href="#pin" data-nav="pin"><i class="bi bi-key" aria-hidden="true"></i><span data-i18n="nav.pin"></span></a>
            <a class="nav-link" href="#api-keys" data-nav="api-keys"><i class="bi bi-code-square" aria-hidden="true"></i><span data-i18n="nav.api_keys"></span></a>
            <!-- Only while app.show_about is on; see about.js. -->
            <a class="nav-link" href="#about" data-nav="about"><i class="bi bi-info-circle" aria-hidden="true"></i><span data-i18n="nav.about"></span></a>
          </div>

          <div id="sidebar-admin" class="sidebar-group" hidden>
            <h3 class="sidebar-heading" data-i18n="nav.admin_heading"></h3>
            <a class="nav-link" href="#users" data-nav="users"><i class="bi bi-people" aria-hidden="true"></i><span data-i18n="nav.users"></span></a>
            <a class="nav-link" href="#invite-links" data-nav="invite-links"><i class="bi bi-link-45deg" aria-hidden="true"></i><span data-i18n="nav.invite_links"></span></a>
            <a class="nav-link" href="#all-keys" data-nav="all-keys"><i class="bi bi-shield-lock" aria-hidden="true"></i><span data-i18n="nav.all_keys"></span></a>
            <!-- The owner's alone: each screen's init checks is_owner. -->
            <a class="nav-link" href="#logs" data-nav="logs"><i class="bi bi-journal-text" aria-hidden="true"></i><span data-i18n="nav.logs"></span></a>
            <a class="nav-link" href="#jobs" data-nav="jobs"><i class="bi bi-clock-history" aria-hidden="true"></i><span data-i18n="nav.jobs"></span></a>
            <a class="nav-link" href="#server-settings" data-nav="server-settings"><i class="bi bi-sliders" aria-hidden="true"></i><span data-i18n="nav.server_settings"></span></a>
          </div>
          <p id="sidebar-version" class="sidebar-version" hidden></p>
        </nav>
      </div>
    </aside>

    <main hidden id="main" class="app-main" tabindex="-1">
      <p id="maintenance-banner" class="alert alert-warning" role="status" hidden></p>
      <!-- server.announcement, until dismissed. See App.showAnnouncement. -->
      <div id="announcement-banner" class="alert alert-info alert-dismissible" role="status" hidden>
        <span id="announcement-text"></span>
        <button id="announcement-dismiss" type="button" class="btn-close" data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <p id="error-banner" class="alert alert-danger" role="alert" hidden></p>

      <!-- While the signed-in screens fetch what they show. See App.renderSignedIn. -->
      <div id="app-loading" class="app-loading" role="status" hidden>
        <span class="spinner-border" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="ui.loading"></span>
      </div>

      <section id="signed-out" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 mb-3" data-i18n="signed_out.heading"></h2>
          <p data-i18n="signed_out.body"></p>
          <p id="invalid-link" class="alert alert-warning mb-0" data-i18n="signed_out.invalid_link" hidden></p>
          <p id="sign-in-expired" class="alert alert-warning mb-0" data-i18n="signed_out.sign_in_expired" hidden></p>
          <p id="session-ended" class="alert alert-warning mb-0" data-i18n="signed_out.session_ended" hidden></p>
          <!-- Only while the owner has auth.passwords on; see password.js. -->
          <div id="password-login" class="mt-3" hidden>
            <hr />
            <h3 class="h6" data-i18n="signed_out.password_heading"></h3>
            <form id="password-login-form" class="row g-3 align-items-end">
              <div class="col-md">
                <label for="login-username" class="form-label" data-i18n="signed_out.username_label"></label>
                <input id="login-username" class="form-control" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required />
              </div>
              <div class="col-md">
                <label for="login-password" class="form-label" data-i18n="signed_out.password_label"></label>
                <input id="login-password" class="form-control" name="password" type="password" autocomplete="current-password" required />
              </div>
              <div class="col-md-auto">
                <button id="password-login-button" class="btn btn-primary" type="submit" data-i18n="signed_out.password_button"></button>
              </div>
            </form>
          </div>
          <!-- Only in a Home Screen app; see bindPasteLogin in app.js. -->
          <form id="paste-login" class="mt-3" hidden>
            <label class="form-label" for="paste-login-value" data-i18n="signed_out.paste_label"></label>
            <input id="paste-login-value" class="form-control" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required />
            <div class="form-text" data-i18n="signed_out.paste_help"></div>
            <button id="paste-login-button" class="btn btn-primary mt-3" type="submit" data-i18n="signed_out.paste_button"></button>
          </form>
        </div>
      </section>

      <!-- What a login link opens. Nothing is redeemed until the button is
           pressed -- see renderLoginConfirm in app.js. -->
      <section id="login-confirm" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 mb-3" data-i18n="login_confirm.heading"></h2>
          <p data-i18n="login_confirm.body"></p>
          <p id="login-switch-warning" class="alert alert-warning" hidden></p>
          <button id="login-confirm-button" class="btn btn-primary" data-i18n="login_confirm.button"></button>
        </div>
      </section>

      <!-- Any sign-in on an account with two-factor on ends here: a login
           link, a password or an invite link. See two_factor.js. -->
      <section id="two-factor-step" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 mb-3" data-i18n="two_factor.step_heading"></h2>
          <p data-i18n="two_factor.step_body"></p>
          <form id="two-factor-step-form" class="row g-3 align-items-end" autocomplete="off">
            <div class="col-md">
              <label for="two-factor-step-code" class="form-label" data-i18n="two_factor.code_label"></label>
              <input id="two-factor-step-code" class="form-control" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="24" required />
            </div>
            <div class="col-md-auto">
              <button id="two-factor-step-button" class="btn btn-primary" type="submit" data-i18n="two_factor.step_button"></button>
            </div>
          </form>
        </div>
      </section>

      <!-- What an invite link opens: type a name, then either pick yourself
           from "did you mean" or join as someone new. See join.js. -->
      <section id="join" class="card" hidden>
        <div class="card-body">
          <h2 id="join-heading" class="h4 mb-3"></h2>
          <p id="join-invalid" class="alert alert-warning" data-i18n="join.invalid" hidden></p>
          <p id="join-switch-warning" class="alert alert-warning" hidden></p>

          <div id="join-name-step" hidden>
            <p data-i18n="join.body"></p>
            <form id="join-name-form" class="row g-3 align-items-end" autocomplete="off">
              <div class="col-md">
                <label for="join-name" class="form-label" data-i18n="join.name_label"></label>
                <input id="join-name" class="form-control" name="display_name" maxlength="80" required
                       data-i18n-attr="placeholder:join.name_placeholder" />
              </div>
              <div class="col-md-auto">
                <button type="submit" class="btn btn-primary" data-i18n="join.continue_button"></button>
              </div>
            </form>
          </div>

          <div id="join-choose" hidden>
            <p id="join-choose-heading"></p>
            <div id="join-matches" class="list-group mb-3"></div>
            <p id="join-full" class="text-body-secondary" data-i18n="join.full" hidden></p>
            <div class="row-actions">
              <button id="join-create-button" class="btn btn-primary"></button>
              <button id="join-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
            </div>
          </div>

          <div id="join-pin-step" hidden>
            <p id="join-pin-prompt"></p>
            <form id="join-pin-form" autocomplete="off">
              <div class="mb-3">
                <label for="join-pin" class="form-label" data-i18n="join.pin_label"></label>
                <input id="join-pin" class="form-control" name="pin" type="password" inputmode="numeric" maxlength="8" required />
              </div>
              <div class="row-actions">
                <button type="submit" class="btn btn-primary" data-i18n="join.pin_button"></button>
                <button type="button" id="join-pin-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section id="signed-in" hidden>
        <!-- The boards home: boards I can open, and cards shared with me. See
             home.js. -->
        <section class="view view-stack" data-view="boards" id="home">
          <div class="card">
            <div class="card-body">
              <h2 class="h4 mb-3" data-i18n="home.create_heading"></h2>
              <form id="create-board-form" class="row g-3 align-items-end" autocomplete="off">
                <div class="col-md">
                  <label for="new-board-title" class="form-label" data-i18n="home.board_title_label"></label>
                  <input id="new-board-title" class="form-control" maxlength="120" required data-i18n-attr="placeholder:home.board_title_placeholder" />
                </div>
                <div class="col-md-auto">
                  <button type="submit" class="btn btn-primary" data-i18n="home.create_button"></button>
                </div>
              </form>
            </div>
          </div>
          <input id="board-search" class="form-control home-search" type="search" autocomplete="off" data-i18n-attr="placeholder:home.search_placeholder,aria-label:home.search_label" />
          <p id="no-matches" class="text-body-secondary" data-i18n="home.no_matches" hidden></p>

          <!-- The boards most recently changed, yours and shared, for a quick jump back. -->
          <section id="recent-section" class="home-section" hidden>
            <div class="home-section-head">
              <h2 class="section-title h5" data-i18n="home.recent_heading"></h2>
            </div>
            <div id="recent-boards" class="boards-grid"></div>
          </section>

          <!-- Boards you own, in your folders. -->
          <section id="own-section" class="home-section">
            <div class="home-section-head">
              <h2 class="section-title h5" data-i18n="home.boards_heading"></h2>
              <select id="folder-sort" class="form-select form-select-sm w-auto" data-i18n-attr="aria-label:home.folder_sort_label,title:home.folder_sort_label">
                <option value="" data-i18n="home.folder_sort_name"></option>
                <option value="manual" data-i18n="home.folder_sort_manual"></option>
              </select>
              <button type="button" id="new-folder-button" class="btn btn-sm btn-outline-secondary" data-i18n="home.new_folder"></button>
            </div>
            <div id="board-folders" class="board-folders"></div>
            <p id="no-boards" class="text-body-secondary" data-i18n="home.no_boards" hidden></p>
          </section>

          <!-- Other people's boards you are on, and single cards shared with you. -->
          <section id="shared-section" class="home-section" hidden>
            <div class="home-section-head">
              <h2 class="section-title h5" data-i18n="home.shared_heading"></h2>
            </div>
            <div id="shared-boards" class="boards-grid"></div>
            <div id="shared-cards-section" hidden>
              <h3 class="home-subheading h6" data-i18n="home.shared_cards_heading"></h3>
              <ul id="shared-cards" class="link-list list-group"></ul>
            </div>
          </section>
        </section>

        <section class="card view" data-view="account" id="account-panel">
          <div class="card-body">
            <h2 class="h4 mb-3" data-i18n="account.heading"></h2>
            <form id="rename-form" class="row g-3 align-items-end" autocomplete="off">
              <div class="col-md">
                <label for="display-name" class="form-label" data-i18n="account.display_name_label"></label>
                <input id="display-name" class="form-control" name="display_name" maxlength="80" required
                       data-i18n-attr="placeholder:account.display_name_placeholder" />
              </div>
              <div class="col-md-auto">
                <button type="submit" class="btn btn-primary" data-i18n="account.save_button"></button>
              </div>
            </form>

            <!-- A login link for yourself; see login_link.js.
                 Sessions only: an API key cannot mint one. -->
            <div id="own-login-panel" hidden>
              <hr />
              <h3 class="h6" data-i18n="own_login.heading"></h3>
              <p class="text-body-secondary" data-i18n="own_login.description"></p>
              <div id="own-login-live" class="d-flex flex-wrap align-items-center gap-2 mb-3" hidden>
                <span id="own-login-live-text"></span>
                <button type="button" id="own-login-cancel" class="btn btn-sm btn-outline-danger" data-i18n="login_links.cancel_button"></button>
              </div>
              <div class="row g-3 align-items-end">
                <div class="col-sm">
                  <label for="own-login-uses" class="form-label" data-i18n="login_links.uses_label"></label>
                  <select id="own-login-uses" class="form-select"></select>
                </div>
                <div class="col-sm">
                  <label for="own-login-expires" class="form-label" data-i18n="login_links.expires_label"></label>
                  <select id="own-login-expires" class="form-select"></select>
                </div>
                <div class="col-sm-auto">
                  <button type="button" id="own-login-button" class="btn btn-outline-secondary" data-i18n="own_login.create_button"></button>
                </div>
              </div>
              <div class="form-text" data-i18n="login_links.expires_help"></div>
              <div id="own-login-box" class="alert alert-info mt-3" hidden>
                <p id="own-login-expiry" class="mb-2"></p>
                <div class="link-box">
                  <code id="own-login-value"></code>
                  <button type="button" id="own-login-copy" class="btn btn-sm btn-outline-secondary" data-i18n="own_login.copy_button"></button>
                </div>
              </div>
            </div>

            <!-- Password sign-in, while the owner has auth.passwords on; see
                 password.js. -->
            <div id="password-panel" hidden>
              <hr />
              <h3 class="h6" data-i18n="password.heading"></h3>
              <p class="text-body-secondary" data-i18n="password.description"></p>
              <p><span id="password-status" class="badge text-bg-secondary"></span></p>
              <form id="password-form" class="row g-3" autocomplete="off">
                <div class="col-md-4">
                  <label for="password-username" class="form-label" data-i18n="password.username_label"></label>
                  <input id="password-username" class="form-control" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required />
                  <div class="form-text" data-i18n="password.username_help"></div>
                </div>
                <div class="col-md-4">
                  <label for="password-new" class="form-label" data-i18n="password.new_label"></label>
                  <input id="password-new" class="form-control" name="password" type="password" autocomplete="new-password" required />
                  <div class="form-text" data-i18n="password.new_help"></div>
                </div>
                <div class="col-md-4">
                  <label for="password-confirm" class="form-label" data-i18n="password.confirm_label"></label>
                  <input id="password-confirm" class="form-control" name="confirm" type="password" autocomplete="new-password" required />
                </div>
                <div id="password-code-row" class="col-md-4" hidden>
                  <label for="password-code" class="form-label" data-i18n="two_factor.code_label"></label>
                  <input id="password-code" class="form-control" name="code" autocomplete="one-time-code" spellcheck="false" maxlength="24" />
                </div>
                <div class="col-12 d-flex flex-wrap gap-2">
                  <button id="password-save-button" type="submit" class="btn btn-primary" data-i18n="password.save_button"></button>
                  <button type="button" id="password-remove-button" class="btn btn-outline-danger" data-i18n="password.remove_button" hidden></button>
                </div>
              </form>
            </div>

            <!-- Two-factor sign-in with an authenticator app; see two_factor.js. -->
            <div id="two-factor-panel" hidden>
              <hr />
              <h3 class="h6" data-i18n="two_factor.heading"></h3>
              <p class="text-body-secondary" data-i18n="two_factor.description"></p>
              <p><span id="two-factor-status" class="badge text-bg-secondary"></span></p>
              <button type="button" id="two-factor-start-button" class="btn btn-outline-secondary" data-i18n="two_factor.start_button" hidden></button>
              <form id="two-factor-disable-form" class="row g-3 align-items-end" autocomplete="off" hidden>
                <div class="col-md">
                  <label for="two-factor-disable-code" class="form-label" data-i18n="two_factor.code_label"></label>
                  <input id="two-factor-disable-code" class="form-control" name="code" autocomplete="one-time-code" spellcheck="false" maxlength="24" required />
                </div>
                <div class="col-md-auto">
                  <button type="submit" class="btn btn-outline-danger" data-i18n="two_factor.disable_button"></button>
                </div>
              </form>
              <div id="two-factor-setup" hidden>
                <p data-i18n="two_factor.setup_scan"></p>
                <canvas id="two-factor-qr" class="two-factor-qr mb-3"></canvas>
                <p class="mb-1" data-i18n="two_factor.setup_manual"></p>
                <div class="link-box mb-3">
                  <code id="two-factor-secret"></code>
                  <button type="button" id="two-factor-secret-copy" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.copy_secret_button"></button>
                </div>
                <form id="two-factor-confirm-form" class="row g-3 align-items-end" autocomplete="off">
                  <div class="col-md">
                    <label for="two-factor-code" class="form-label" data-i18n="two_factor.setup_code_label"></label>
                    <input id="two-factor-code" class="form-control" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
                  </div>
                  <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary" data-i18n="two_factor.confirm_button"></button>
                  </div>
                </form>
              </div>
              <div id="two-factor-recovery" class="alert alert-info" hidden>
                <p class="mb-2" data-i18n="two_factor.recovery_notice"></p>
                <pre id="two-factor-recovery-codes" class="mb-2"></pre>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" id="two-factor-recovery-copy" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.copy_button"></button>
                  <button type="button" id="two-factor-recovery-download" class="btn btn-sm btn-outline-secondary" data-i18n="two_factor.download_button"></button>
                  <button type="button" id="two-factor-recovery-done" class="btn btn-sm btn-primary" data-i18n="two_factor.done_button"></button>
                </div>
              </div>
            </div>

            <!-- Where this account is signed in; see sessions.js. -->
            <div id="sessions-panel" hidden>
              <hr />

                    <th scope="col" data-i18n="api_keys.table_status"></th>
                    <th scope="col" data-sort="last_used_at"><button type="button" class="th-sort" data-i18n="api_keys.table_last_used"></button></th>
                    <th scope="col" data-sort="expires_at"><button type="button" class="th-sort" data-i18n="api_keys.table_expires"></button></th>
                    <th scope="col" data-i18n="api_keys.table_actions"></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- The activity log, owner only; see logs.js. data-no-track keeps
             reading the log from writing to it (track.js). -->
        <section class="card view" data-view="logs" id="logs-panel" data-no-track hidden>
          <div class="card-body">
            <h2 class="h4 mb-3" data-i18n="logs.heading"></h2>
            <p class="text-body-secondary" data-i18n="logs.description"></p>

            <form id="logs-search-form" class="row g-2 align-items-end" role="search" autocomplete="off">
              <div class="col-md">
                <label for="logs-query" class="form-label" data-i18n="logs.search_label"></label>
                <input id="logs-query" class="form-control" type="search" name="q" maxlength="200"
                       data-i18n-attr="placeholder:logs.search_placeholder" />
              </div>
              <div class="col-md-auto row-actions">
                <button type="button" id="logs-live" class="btn btn-outline-secondary" aria-pressed="false">
                  <i class="bi bi-broadcast" aria-hidden="true"></i> <span data-i18n="logs.live_button"></span>
                </button>
                <button type="button" id="logs-prune" class="btn btn-outline-secondary" data-i18n="logs.prune_button"></button>
              </div>
            </form>
            <p class="form-text" data-i18n="logs.search_help"></p>
            <div id="logs-kinds" class="row-actions mb-3" role="group" data-i18n-attr="aria-label:logs.kinds_label"></div>

            <!-- What the owner calls addresses. See Logs.refreshNames. -->
            <details class="ip-names mb-3">
              <summary id="ip-names-summary" class="ip-names-summary"></summary>
              <div class="table-responsive mt-2">
                <table id="ip-names-table" class="table table-hover align-middle" data-empty="logs.ip_names_empty">
                  <thead>
                    <tr>
                      <th scope="col" data-i18n="logs.table_ip_name"></th>
                      <th scope="col" data-i18n="logs.table_ip_target"></th>
                      <th scope="col" data-i18n="logs.table_ip_actions"></th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <button id="ip-names-add" type="button" class="btn btn-sm btn-outline-secondary" data-i18n="logs.ip_names_add"></button>
            </details>

            <p id="logs-settings" class="small text-body-secondary"></p>

            <!-- One day at a time; the calendar picks which. See logs.js. -->
            <div class="log-calendar" role="group" data-i18n-attr="aria-label:logs.calendar_label">
              <div class="log-cal-head">
                <button type="button" id="logs-cal-prev" class="btn btn-sm btn-outline-secondary" data-i18n-attr="aria-label:logs.prev_month,title:logs.prev_month">
                  <i class="bi bi-chevron-left" aria-hidden="true"></i>
                </button>
                <span id="logs-cal-title" class="log-cal-title" aria-live="polite"></span>
                <button type="button" id="logs-cal-next" class="btn btn-sm btn-outline-secondary" data-i18n-attr="aria-label:logs.next_month,title:logs.next_month">
                  <i class="bi bi-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" id="logs-cal-today" class="btn btn-sm btn-outline-secondary ms-auto" data-i18n="logs.today_button"></button>
              </div>
              <div id="logs-cal-grid" class="log-cal-grid"></div>
            </div>
            <p id="logs-empty" class="text-body-secondary mb-0" hidden></p>
            <div id="logs-day"></div>
          </div>
        </section>

        <!-- Background jobs, owner only; see jobs.js. -->
        <section class="card view" data-view="jobs" id="jobs-panel" hidden>
          <div class="card-body">
            <h2 class="h4 mb-3" data-i18n="jobs.heading"></h2>
            <p class="text-body-secondary" data-i18n="jobs.description"></p>
            <div class="table-responsive">
              <table id="jobs-table" class="table table-hover align-middle mb-0" data-empty="jobs.empty">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="jobs.table_name"></th>
                    <th scope="col" data-i18n="jobs.table_status"></th>
                    <th scope="col" data-i18n="jobs.table_last"></th>
                    <th scope="col" data-i18n="jobs.table_next"></th>
                    <th scope="col" data-i18n="jobs.table_note"></th>
                    <th scope="col" data-i18n="jobs.table_actions"></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Owner only: config.yaml, one field per setting. See js/settings.js.
             Not the personal Settings screen (#settings) above. -->
        <section class="card view" data-view="server-settings" id="settings-panel" hidden>
          <div class="card-body">
            <h2 class="h4 mb-3" data-i18n="settings.heading"></h2>
            <p class="text-body-secondary" data-i18n="settings.description"></p>
            <p class="small text-body-secondary mb-1"><code id="settings-file"></code></p>
            <p id="settings-secret" class="small text-body-secondary"></p>

            <div id="settings-invalid" class="alert alert-danger settings-help" role="alert" hidden></div>
            <div id="settings-stale" class="alert alert-warning" role="alert" data-i18n="settings.stale" hidden></div>
            <div id="settings-read-only" class="alert alert-secondary" role="status" data-i18n="settings.read_only" hidden></div>

            <!-- Outside the form, so Enter in the filter is not a save. -->
            <div class="settings-tools" role="search">
              <div class="d-flex align-items-center gap-2">
                <label for="settings-filter" class="visually-hidden" data-i18n="settings.filter_label"></label>
                <input id="settings-filter" class="form-control" type="search" autocomplete="off"
                       data-i18n-attr="placeholder:settings.filter_label" />
                <span id="settings-filter-status" class="small text-body-secondary text-nowrap" role="status"></span>
              </div>
              <nav id="settings-jump" class="settings-jump" data-i18n-attr="aria-label:settings.jump_label"></nav>
            </div>

            <form id="settings-form" autocomplete="off" novalidate>
              <div id="settings-sections"></div>
              <div id="settings-problems" class="alert alert-danger settings-help" role="alert" hidden></div>
              <div id="settings-changed" class="alert alert-warning d-flex align-items-center gap-2" role="alert" hidden>
                <span class="me-auto" data-i18n="settings.changed_on_disk"></span>
              </div>
              <div class="settings-actions row-actions">
                <button type="submit" id="settings-save" class="btn btn-primary" data-i18n="settings.save_button" disabled></button>
                <button type="button" id="settings-reload" class="btn btn-outline-secondary" data-i18n="settings.reload_button"></button>
                <span id="settings-unsaved" class="small text-body-secondary"></span>
              </div>
            </form>
          </div>
        </section>
      </section>
    </main>
  </div>

  <!-- "Saved.", "Copied.", "API key deleted · Undo": see Dom.toast. -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast border-0" role="status" aria-live="polite" aria-atomic="true">
      <div id="toast-body" class="toast-body d-flex align-items-center gap-2">
        <span id="toast-text" class="me-auto"></span>
        <button id="toast-action" type="button" class="btn btn-sm btn-light" hidden></button>
      </div>
    </div>
  </div>

  <!-- Asks before anything that cannot be taken back: see Dom.confirm. -->
  <div id="confirm-modal" class="modal fade" tabindex="-1" aria-labelledby="confirm-text" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div id="confirm-text" class="modal-body"></div>
        <div class="modal-footer">
          <button id="confirm-cancel" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.cancel"></button>
          <button id="confirm-ok" type="button" class="btn btn-danger" data-i18n="ui.confirm"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- A small form in a dialog: see Dom.form, which fills it in. -->
  <div id="form-modal" class="modal fade" tabindex="-1" aria-labelledby="form-modal-title" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="form-modal-form" autocomplete="off">
          <div class="modal-header">
            <h2 id="form-modal-title" class="modal-title fs-5"></h2>
          </div>
          <div class="modal-body">
            <div id="form-modal-fields" class="vstack gap-3"></div>
            <div id="form-modal-problem" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ui.cancel"></button>
            <button id="form-modal-save" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- The side panel the folder and move-board forms open in (Panel in
       ui.js), shared with the board page. -->
  <dialog id="panel-dialog" class="app-dialog panel-dialog">
    <div class="panel-head d-flex align-items-center justify-content-between gap-2 border-bottom">
      <h2 id="panel-title" class="h5 mb-0"></h2>
      <button type="button" id="panel-close" class="btn-close" data-i18n-attr="aria-label:ui.close,title:ui.close"></button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </dialog>

  <!--
    Plain scripts in dependency order. No bundler, no modules that need a
    build step: each file adds one global and the browser runs them as-is.
    Third-party libraries go in /vendor/ (downloaded once, served by us) so
    the Content-Security-Policy can stay locked to 'self'.
  -->
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/vendor/marked/marked.min.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
  <script src="/vendor/sortable/Sortable.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/mhchem.min.js"></script>
  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/undo.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/track.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/mcp.js"></script>
  <script src="/js/join.js"></script>
  <script src="/js/pin.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/login_links.js"></script>
  <script src="/js/login_link.js"></script>
  <script src="/js/password.js"></script>
  <script src="/js/two_factor.js"></script>
  <script src="/js/sessions.js"></script>
  <script src="/js/about.js"></script>
  <script src="/js/invites.js"></script>
  <script src="/js/logs.js"></script>
  <script src="/js/jobs.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/color_picker.js"></script>
  <script src="/js/theme_editor.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/backup.js"></script>
  <script src="/js/push_client.js"></script>
  <script src="/js/notify_settings.js"></script>
  <script src="/js/user_settings.js"></script>
  <script src="/js/fresh.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
